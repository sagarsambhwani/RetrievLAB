name: Notify Portfolio Update

on:
  push:
    branches: [main]

jobs:
  notify-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portfolio Workflow
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PROFILE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sagarsambhwani/sagarsambhwani/dispatches \
            -d '{"event_type": "update-portfolio"}'
