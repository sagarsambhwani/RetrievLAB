name: Notify Portfolio Update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Portfolio Workflow
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | tr -d '\r\n')
          curl -f -X POST \
            -H "Authorization: Bearer ${PROFILE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sagarsambhwani/sagarsambhwani/dispatches \
            -d "{\"event_type\": \"update-portfolio\", \"client_payload\": {\"repo\": \"RetrievLAB\", \"commit\": \"${COMMIT_MSG}\", \"sha\": \"${{ github.sha }}\"}}"
